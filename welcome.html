<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Pong Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px;
    }

    canvas {
      background: #000;
      border: 3px solid white;
      display: block;
      margin: 20px auto;
      max-width: 95%;
      touch-action: none;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 10px;
    }

    .controls button {
      width: 100px;
      font-size: 24px;
      touch-action: none;
    }

    .game-buttons {
      margin: 15px;
    }
  </style>
</head>

<body>

  <h1>🎮 Pong Game</h1>

  <p>
    Use <b>W</b> and <b>S</b> or mobile buttons to move your paddle.
  </p>

  <canvas id="gameCanvas" width="800" height="450"></canvas>

  <div class="controls">
    <button id="upButton">▲</button>
    <button id="downButton">▼</button>
  </div>

  <div class="game-buttons">
    <button id="startButton">▶ Start Game</button>
    <button id="stopButton">⏸ Stop Game</button>
    <button id="restartButton">🔄 Restart Game</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const player = {
      x: 20,
      y: 180,
      width: 12,
      height: 90,
      speed: 7,
      score: 0
    };

    const computer = {
      x: canvas.width - 32,
      y: 180,
      width: 12,
      height: 90,
      speed: 4,
      score: 0
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 9,
      speedX: 5,
      speedY: 4
    };

    let keys = {};
    let gameStarted = false;
    let animationId = null;

    // Keyboard
    document.addEventListener("keydown", function(e) {
      keys[e.key.toLowerCase()] = true;
    });

    document.addEventListener("keyup", function(e) {
      keys[e.key.toLowerCase()] = false;
    });

    // Mobile controls
    function mobileControl(button, key) {
      button.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        keys[key] = true;
      });

      button.addEventListener("pointerup", function(e) {
        e.preventDefault();
        keys[key] = false;
      });

      button.addEventListener("pointerleave", function() {
        keys[key] = false;
      });
    }

    mobileControl(
      document.getElementById("upButton"),
      "w"
    );

    mobileControl(
      document.getElementById("downButton"),
      "s"
    );

    // Draw paddle
    function drawPaddle(paddle) {
      ctx.fillStyle = "white";
      ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
      );
    }

    // Draw ball
    function drawBall() {
      ctx.beginPath();
      ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
      );
      ctx.fillStyle = "white";
      ctx.fill();
    }

    // Center line
    function drawCenterLine() {
      ctx.setLineDash([10, 10]);
      ctx.strokeStyle = "white";

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      ctx.setLineDash([]);
    }

    // Score
    function drawScore() {
      ctx.font = "24px Arial";
      ctx.fillStyle = "white";

      ctx.fillText(
     "you: " + player.score,
        canvas.width / 2 - 170,
        40
      );

      ctx.fillText(
    "computer: " + computer.score,
        canvas.width / 2 + 50,
        40
      );
    }

    // Update game
    function update() {

      // Player
      if (keys["w"]) {
        player.y -= player.speed;
      }

      if (keys["s"]) {
        player.y += player.speed;
      }

      // Keep player inside canvas
      player.y = Math.max(
        0,
        Math.min(
          canvas.height - player.height,
          player.y
        )
      );

      // Computer follows ball
      if (
        ball.y >
        computer.y + computer.height / 2
      ) {
        computer.y += computer.speed;
      }

      if (
        ball.y <
        computer.y + computer.height / 2
      ) {
        computer.y -= computer.speed;
      }

      // Keep computer inside canvas
      computer.y = Math.max(
        0,
        Math.min(
          canvas.height - computer.height,
          computer.y
        )
      );

      // Ball movement
      ball.x += ball.speedX;
      ball.y += ball.speedY;

      // Top / bottom collision
      if (
        ball.y - ball.radius <= 0 ||
        ball.y + ball.radius >= canvas.height
      ) {
        ball.speedY *= -1;
      }

      // Left paddle
      if (
        ball.x - ball.radius <= player.x + player.width &&
        ball.x + ball.radius >= player.x &&
        ball.y >= player.y &&
        ball.y <= player.y + player.height &&
        ball.speedX < 0
      ) {
        ball.speedX = Math.abs(ball.speedX);
      }

      // Right paddle
      if (
        ball.x + ball.radius >= computer.x &&
        ball.x - ball.radius <= computer.x + computer.width &&
        ball.y >= computer.y &&
        ball.y <= computer.y + computer.height &&
        ball.speedX > 0
      ) {
        ball.speedX = -Math.abs(ball.speedX);
      }

      // Computer scores when player misses
      if (ball.x - ball radius <= 0) {
        computer.score++;
        resetBall();
      }

      // Player scores when computer misses
      if (ball.x + ball radius >= canvas.width) {
        player.score++;
        resetBall();
      }
    }

    // Reset ball
    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      ball.speedX =
        Math.random() > 0.5 ? 5 : -5;

      ball.speedY =
        Math.random() > 0.5 ? 4 : -4;
    }

    // Draw everything
    function draw() {
      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawCenterLine();
      drawPaddle(player);
      drawPaddle(computer);
      drawBall();
      drawScore();
    }

    // Game loop
    function gameLoop() {
      if (!gameStarted) {
        return;
      }

      update();
      draw();

      animationId =
        requestAnimationFrame(gameLoop);
    }

    // START
    document
      .getElementById("startButton")
      .addEventListener("click", function() {

        if (!gameStarted) {
          gameStarted = true;
          gameLoop();
        }

      });

    // STOP
    document
      .getElementById("stopButton")
      .addEventListener("click", function() {

        gameStarted = false;

        if (animationId !== null) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }

        draw();
      });

    // RESTART
    document
      .getElementById("restartButton")
      .addEventListener("click", function() {

        if (animationId !== null) {
          cancelAnimationFrame(animationId);
        }

        player.score = 0;
        computer.score = 0;

        player.y =
          canvas.height / 2 -
          player.height / 2;

        computer.y =
          canvas.height / 2 -
          computer.height / 2;

        resetBall();

        gameStarted = true;

        gameLoop();
      });

    // Initial screen
    draw();
  </script>

</body>
</html>
