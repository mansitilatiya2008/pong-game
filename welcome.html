<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Pong Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px;
    }

    canvas {
      background: #000;
      border: 3px solid white;
      display: block;
      margin: 20px auto;
      max-width: 95%;
      touch-action: none;
    }

    button {
      padding: 10px 25px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 10px auto 20px;
    }

    .controls button {
      width: 100px;
      font-size: 24px;
      user-select: none;
      touch-action: none;
    }

    .game-buttons {
      margin: 10px;
    }
  </style>
</head>

<body>

  <h1>🎮 Pong Game</h1>

  <p>
    Keyboard par <b>W</b> aur <b>S</b> dabayein,
    ya mobile par buttons use karein.
  </p>

  <canvas id="gameCanvas" width="800" height="450"></canvas>

  <div class="controls">
    <button id="upButton">▲</button>
    <button id="downButton">▼</button>
  </div>

  <div class="game-buttons">
    <button id="startButton">▶ Start Game</button>
    <button id="restartButton">🔄 Restart Game</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const player = {
      x: 20,
      y: 180,
      width: 12,
      height: 90,
      speed: 7,
      score: 0
    };

    const computer = {
      x: canvas.width - 32,
      y: 180,
      width: 12,
      height: 90,
      speed: 4,
      score: 0
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 9,
      speedX: 5,
      speedY: 4
    };

    let keys = {};
    let gameStarted = false;
    let animationId = null;

    // Keyboard
    document.addEventListener("keydown", function(e) {
      keys[e.key.toLowerCase()] = true;
    });

    document.addEventListener("keyup", function(e) {
      keys[e.key.toLowerCase()] = false;
    });

    // Mobile controls
    function pressKey(key) {
      keys[key] = true;
    }

    function releaseKey(key) {
      keys[key] = false;
    }

    const upButton = document.getElementById("upButton");
    const downButton = document.getElementById("downButton");

    upButton.addEventListener("pointerdown", function(e) {
      e.preventDefault();
      pressKey("w");
    });

    upButton.addEventListener("pointerup", function(e) {
      e.preventDefault();
      releaseKey("w");
    });

    upButton.addEventListener("pointerleave", function() {
      releaseKey("w");
    });

    downButton.addEventListener("pointerdown", function(e) {
      e.preventDefault();
      pressKey("s");
    });

    downButton.addEventListener("pointerup", function(e) {
      e.preventDefault();
      releaseKey("s");
    });

    downButton.addEventListener("pointerleave", function() {
      releaseKey("s");
    });

    function drawRect(x, y, width, height) {
      ctx.fillStyle = "white";
      ctx.fillRect(x, y, width, height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "white";
      ctx.fill();
    }

    function drawCenterLine() {
      ctx.setLineDash([10, 10]);
      ctx.strokeStyle = "white";
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawScore() {
      ctx.font = "40px Arial";
      ctx.fillStyle = "white";
      ctx.fillText(player.score, canvas.width / 2 - 70, 50);
      ctx.fillText(computer.score, canvas.width / 2 + 50, 50);
    }

    function update() {

      // Player
      if (keys["w"] && player.y > 0) {
        player.y -= player.speed;
      }

      if (
        keys["s"] &&
        player.y + player.height < canvas.height
      ) {
        player.y += player.speed;
      }

      // Computer paddle
      if (computer.y + computer.height / 2 < ball.y) {
        computer.y += computer.speed;
      } else {
        computer.y -= computer.speed;
      }

      computer.y = Math.max(
        0,
        Math.min(canvas.height - computer.height, computer.y)
      );

      // Ball
      ball.x += ball.speedX;
      ball.y += ball.speedY;

      // Top / bottom
      if (
        ball.y - ball.radius <= 0 ||
        ball.y + ball.radius >= canvas.height
      ) {
        ball.speedY *= -1;
      }

      // Left paddle
      if (
        ball.x - ball.radius <= player.x + player.width &&
        ball.x + ball.radius >= player.x &&
        ball.y >= player.y &&
        ball.y <= player.y + player.height &&
        ball.speedX < 0
      ) {
        ball.speedX = Math.abs(ball.speedX);
      }

      // Right paddle
      if (
        ball.x + ball.radius >= computer.x &&
        ball.x - ball.radius <= computer.x + computer.width &&
        ball.y >= computer.y &&
        ball.y <= computer.y + computer.height &&
        ball.speedX > 0
      ) {
        ball.speedX = -Math.abs(ball.speedX);
      }

      // Computer score
      if (ball.x < 0) {
        computer.score++;
        resetBall();
      }

      // Player score
      if (ball.x > canvas.width) {
        player.score++;
        resetBall();
      }
    }

    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      ball.speedX = Math.random() > 0.5 ? 5 : -5;
      ball.speedY = Math.random() > 0.5 ? 4 : -4;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawCenterLine();
      drawRect(
        player.x,
        player.y,
        player.width,
        player.height
      );

      drawRect(
        computer.x,
        computer.y,
        computer.width,
        computer.height
      );

      drawBall();
      drawScore();
    }

    function gameLoop() {
      if (!gameStarted) return;

      update();
      draw();

      animationId = requestAnimationFrame(gameLoop);
    }

    // Start button
    document.getElementById("startButton").addEventListener("click", function() {
      if (!gameStarted) {
        gameStarted = true;
        gameLoop();
      }
    });

    // Restart button
    document.getElementById("restartButton").addEventListener("click", function() {
      player.score = 0;
      computer.score = 0;

      player.y = canvas.height / 2 - player.height / 2;
      computer.y = canvas.height / 2 - computer.height / 2;

      resetBall();

      gameStarted = true;

      if (animationId) {
        cancelAnimationFrame(animationId);
      }

      gameLoop();
    });

    // Initial screen
    draw();
  </script>

</body>
</html>
